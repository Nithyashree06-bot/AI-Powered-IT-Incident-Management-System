# IncidentIQ — Spring Boot Application Properties
# Team Pivot 4 | J.J. College of Engineering and Technology

spring.application.name=incidentiq-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/incidentiq?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yourpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Seed Data initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your_jwt_secret_key_minimum_32_chars_long_incidentiq_key_2024}
jwt.expiry=${JWT_EXPIRY:86400000}

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}

# CORS Configuration
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.incidentiq=DEBUG
logging.level.org.springframework.security=INFO
