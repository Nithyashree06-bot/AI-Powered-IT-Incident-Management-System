# IncidentIQ — Spring Boot Application Properties
# Team Pivot 4 | J.J. College of Engineering and Technology
# External Database: Supabase PostgreSQL via JDBC

spring.application.name=incidentiq-backend
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------
# Supabase PostgreSQL Database Configuration
# Live Project: db.lghojfoknvnpprployea.supabase.co
# -------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://db.lghojfoknvnpprployea.supabase.co:5432/postgres?user=postgres&password=Nithya%4025012006
spring.datasource.username=postgres
spring.datasource.password=Nithya@25012006
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------
# JPA & Hibernate Settings (PostgreSQL ORM)
# -------------------------------------------------------------
# Automatically creates/maintains all 5 Document 05 tables:
# users, tickets, categories, ticket_comments, ticket_history
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------
# HikariCP Connection Pooling for Supabase
# -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------
# SQL Initialization
# -------------------------------------------------------------
spring.sql.init.mode=never

# -------------------------------------------------------------
# Phase 3: JWT Authentication & Security Configuration
# -------------------------------------------------------------
jwt.secret=incidentiq_jwt_super_secret_signing_key_2024_hmac_sha256_secured_key
jwt.expiry=86400000

# -------------------------------------------------------------
# Google Gemini API
# -------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}

# -------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# -------------------------------------------------------------
# SpringDoc OpenAPI / Swagger UI
# -------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------
# Logging
# -------------------------------------------------------------
logging.level.com.incidentiq=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
